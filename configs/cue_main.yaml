# GPU plan of 22 October, experiment I1 (docs/exploratory_log.md, "GPU plan of 22 October"). Acoustic intervention.
# Each container of the duration axis of the main bank goes through a band-pass from 60 to 6000 Hz
# (order-8 Butterworth, zero phase) before entering the model, to remove the VoxConverse band
# cut-off above 7.4 kHz and the differences below 40 Hz. Exploratory.
run_name: cue-main
model:
  id: Qwen/Qwen2-Audio-7B-Instruct
  revision: 0a095220c30b7b31434169c3086508ef3ea5bf0a   # Hugging Face commit of 12 January 2025
  quant: nf4
prompt_key: ab
llm_layers: [8, 16, 24]
adapter: models/lora_retrained_v1   # retrained LoRA (configs/retrain.yaml)
backbones: [base, lora]
stages: [data_test, check_base, extract_base_eval, check_lora, extract_lora_eval]
audio_transform: {kind: bandpass, lo: 60, hi: 6000, order: 8}
data:
  test:
    tar: data/test_bank_v2.tar
    manifest: test_bank_v2/manifest.csv
    audio: test_bank_v2/audio
    expect: {rows: 21340, conditions: 22, base_ids: 970, rec_ids: 695, speech_share: 0.5}
  train: null
selection: {pilot: false, seed: 42, axes: [duration]}
extraction: {shard_size: 250, n_content_free: 8}
