# GPU plan of 22 October, experiment I1. The provenance bank v3 with the same band-pass
# as cue_main, to measure the transfer of heads trained without the channel cues. Exploratory.
run_name: cue-prov
model:
  id: Qwen/Qwen2-Audio-7B-Instruct
  revision: 0a095220c30b7b31434169c3086508ef3ea5bf0a   # Hugging Face commit of 12 January 2025
  quant: nf4
prompt_key: ab
llm_layers: [8, 16, 24]
adapter: models/lora_retrained_v1   # retrained LoRA (configs/retrain.yaml)
backbones: [base, lora]
stages: [data_test, check_base, extract_base_eval, check_lora, extract_lora_eval]
audio_transform: {kind: bandpass, lo: 60, hi: 6000, order: 8}
data:
  test:
    tar: data/prov_bank_v3.tar
    manifest: prov_bank_v3/manifest.csv
    audio: prov_bank_v3/audio
    expect: {conditions: 8, speech_share: 0.5}
  train: null
selection: {pilot: false, seed: 42}
extraction: {shard_size: 250, n_content_free: 8}
