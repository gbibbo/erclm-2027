# Experiment G2 of 25 October (docs/exploratory_log.md, "Rule for G2, written on 25 October before extraction"). Prompt "B) non-speech, A) speech"
# (ab_speech_second) on the 970 clips of the duration and SNR axes and on the training
# bank, base model only. Together with ba_speech_second it gives the score with speech in second
# place. The analysis uses the same 470 clips from recordings outside the prompt control as G1.
# Exploratory.
run_name: prompt-ab_speech_second-full
model:
  id: Qwen/Qwen2-Audio-7B-Instruct
  revision: 0a095220c30b7b31434169c3086508ef3ea5bf0a   # Hugging Face commit of 12 January 2025
  quant: nf4
prompt_key: ab_speech_second
llm_layers: [8, 16, 24]
backbones: [base]
adapter: models/lora_retrained_v1   # retrained LoRA (configs/retrain.yaml)
stages: [data_test, data_train, check_base, extract_base_eval, extract_base_train]
data:
  test:
    tar: data/test_bank_v2.tar
    manifest: test_bank_v2/manifest.csv
    audio: test_bank_v2/audio
    expect: {rows: 21340, conditions: 22, base_ids: 970, rec_ids: 695, speech_share: 0.5}
  train:
    tar: data/train_bank_v2.tar
    manifest: train_bank_v2/manifest.csv
    audio: train_bank_v2/audio
    expect: {rows: 3072, base_ids: 64, rec_ids: 64, speech_share: 0.5}
selection: {pilot: false, seed: 42, axes: [duration, snr]}
extraction: {shard_size: 250, n_content_free: 8}
