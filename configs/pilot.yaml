# Pilot, technical feasibility only. 50 base excerpts per class with their 22 conditions,
# both backbones and the full analysis. No training bank, so the heads are the _cv ones (exploratory).
# The pilot decides technical feasibility only.
run_name: pilot-v1
model:
  id: Qwen/Qwen2-Audio-7B-Instruct
  revision: 0a095220c30b7b31434169c3086508ef3ea5bf0a   # Hugging Face commit of 12 January 2025
  quant: nf4
prompt_key: ab
llm_layers: [8, 16, 24]
backbones: [base, lora]
adapter: models/lora_retrained_v1   # retrained LoRA (configs/retrain.yaml)
data:
  test:
    tar: data/test_bank_v2.tar
    manifest: test_bank_v2/manifest.csv
    audio: test_bank_v2/audio
    expect: {rows: 21340, conditions: 22, base_ids: 970, rec_ids: 695, speech_share: 0.5}
  train: null
selection: {pilot: true, n_per_class: 50, seed: 42}
extraction: {shard_size: 100, n_content_free: 8}
analysis: {bootstrap_B: 2000, seed: 42, h3_margin: 0.02, prevalence_reps: 20}
