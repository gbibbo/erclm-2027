# Path B. Retrains the task LoRA with the recipe of the study under review (scripts/finetune.py of
# qwen-vad-lora) on the training bank v2, choosing the adapter by the loss on the validation
# bank v2. Saves a checkpoint every 50 steps in checkpoints/retrain-v1/ and the final adapter
# in models/lora_retrained_v1/. Best run on Kaggle (two T4) for the memory.
run_name: retrain-v1
model:
  id: Qwen/Qwen2-Audio-7B-Instruct
  revision: 0a095220c30b7b31434169c3086508ef3ea5bf0a   # Hugging Face commit of 12 January 2025
  quant: nf4
prompt_key: ab
stages: [train_lora]
data:
  train:
    tar: data/train_bank_v2.tar
    manifest: train_bank_v2/manifest.csv
    audio: train_bank_v2/audio
    expect: {rows: 3072, base_ids: 64, rec_ids: 64, speech_share: 0.5}
  dev:
    tar: data/dev_bank_v2.tar
    manifest: dev_bank_v2/manifest.csv
    audio: dev_bank_v2/audio
    expect: {rows: 3456, base_ids: 72, rec_ids: 72, speech_share: 0.5}
retrain:
  output: models/lora_retrained_v1
  recipe: {}   # empty = the recipe of the study under review (erclm.lora_train.RECIPE)
